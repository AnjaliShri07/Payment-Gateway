server:
  port: 8080

spring:
  application:
    name: User
  datasource:
    url: jdbc:mysql://localhost:3306/payment_gateway
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate   # create / update / validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true



logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# OpenAPI / Swagger config
# Springdoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs/user
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method # Sort by HTTP method
    tags-sorter: alpha  # Sort tags alphabetically

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakerevents
  health:
    show-details: always

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3