server:
  port: 8081

spring:
  application:
    name: auth
  datasource:
    url: jdbc:mysql://localhost:3306/payment_gateway
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate   # create / update / validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      password: Test12345_
    filter:
      order: 10

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# OpenAPI / Swagger config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakerevents
  health:
    show-details: always

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

jwt:
  issuer: auth-service
  access-token-validity-seconds: 900   # 15 minutes
  refresh-token-validity-seconds: 1209600 # 14 days


